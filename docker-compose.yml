services:
  cloudflared:
    image: cloudflare/cloudflared:latest@sha256:9b49eed8f62806d5d45ddf59ecefb5710429598ea6d3fcccd2af938f621b2b07
    command: tunnel --no-autoupdate --config /etc/cloudflared/config.yml run
    volumes:
      - ./credentials.json:/etc/cloudflared/credentials.json:ro
    networks:
      - traefik-public
    configs:
      - source: cloudflared-config
        target: /etc/cloudflared/config.yml
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints: [node.role == manager]
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 0

networks:
  traefik-public:
    external: true

configs:
  cloudflared-config:
    file: ./config.yml
