services:
  cloudflared:
    image: cloudflare/cloudflared:2026.10.3@sha256:faa8e0a1475f137c910be6025f43c8e4092fdd35461b31e19fd1390657a1ff39
    command: tunnel --no-autoupdate --config /etc/cloudflared/config.yml run
    volumes:
      - ./credentials.json:/etc/cloudflared/credentials.json:ro
    networks:
      - traefik-public
    configs:
      - source: cloudflared-config
        target: /etc/cloudflared/config.yml
    deploy:
      mode: replicated
      replicas: 1
      update_config:
        order: start-first
        parallelism: 1
        failure_action: rollback
      placement:
        constraints: [node.role == manager]
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 0

networks:
  traefik-public:
    external: true

configs:
  cloudflared-config:
    file: ./config.yml
